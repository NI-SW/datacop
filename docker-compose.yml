services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Info@1234}
      MYSQL_DATABASE: datacop
    volumes:
      - datacop_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    image: libm/datacop:server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:3001"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Info@1234}
      DB_NAME: datacop
      CORS_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy

  mcp:
    image: libm/datacop:mcp
    build:
      context: ./mcp/python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8301}:8301"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Info@1234}
      DB_DATABASE: datacop
      MCP_PORT: "8301"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  datacop_mysql_data:
